version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ["*"]
    ignore:
      # TypeScript 7 removed the compiler API that typescript-eslint uses.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Plugins bundled in eslint-config-next only declare support up to ESLint 9.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
